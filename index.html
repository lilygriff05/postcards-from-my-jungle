<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3e9">
  <title>Small things, drifting</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #23372c;
      --paper: #f4f3e9;
      --muted: #68776a;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background:
        radial-gradient(ellipse at 14% 84%, rgba(193, 210, 163, .24), transparent 34%),
        radial-gradient(ellipse at 85% 12%, rgba(224, 190, 130, .18), transparent 30%),
        var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }
    .intro {
      position: fixed;
      top: clamp(28px, 7vh, 72px);
      left: clamp(24px, 7vw, 100px);
      z-index: 1;
      pointer-events: none;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #6e866e;
      font: 600 11px/1.3 "Segoe UI", sans-serif;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 460px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 6vw, 72px);
      font-weight: 400;
      letter-spacing: -.045em;
      line-height: .98;
    }
    .hint {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .015em;
    }
    #field { position: fixed; inset: 0; overflow: hidden; }
    .dot {
      --dot-color: #547d5a;
      position: absolute;
      display: grid;
      width: 23px;
      height: 23px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: var(--dot-color);
      box-shadow: 0 3px 12px color-mix(in srgb, var(--dot-color) 25%, transparent);
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: width .2s ease, height .2s ease, box-shadow .2s ease;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }
    .dot::after {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: inherit;
      background: rgba(255,255,255,.55);
      content: "";
    }
    .dot:hover, .dot:focus-visible, .dot.is-open {
      width: 31px;
      height: 31px;
      box-shadow: 0 0 0 8px color-mix(in srgb, var(--dot-color) 15%, transparent), 0 5px 18px color-mix(in srgb, var(--dot-color) 30%, transparent);
      outline: none;
    }
    .dot:focus-visible { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--dot-color); }
    .popup {
      position: fixed;
      z-index: 5;
      width: min(260px, calc(100vw - 32px));
      padding: 10px 10px 15px;
      border: 1px solid rgba(42, 65, 48, .1);
      border-radius: 12px;
      background: rgba(255, 255, 250, .96);
      box-shadow: 0 14px 42px rgba(45, 58, 39, .14);
      pointer-events: auto;
      animation: arrive .18s ease-out both;
    }
    .popup[hidden] { display: none; }
    .popup-backdrop {
      position: fixed;
      inset: 0;
      z-index: 4;
      background: rgba(23, 32, 25, .48);
    }
    .popup-backdrop[hidden] { display: none; }
    .popup.is-large {
      top: 50%;
      left: 50%;
      width: min(680px, calc(100vw - 36px));
      max-height: calc(100vh - 36px);
      overflow-y: auto;
      padding: 22px;
      transform: translate(-50%, -50%);
      animation: none;
    }
    .popup.is-large .popup-image {
      width: min(100%, 420px);
      height: auto;
      aspect-ratio: 1;
      margin-right: auto;
      margin-left: auto;
    }
    .popup-kicker {
      margin: 0 8px 7px;
      color: #788a72;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .popup h2 {
      margin: 0 8px 7px;
      color: #293d30;
      font: 400 21px/1.15 Georgia, "Times New Roman", serif;
    }
    #popup-copy {
      display: -webkit-box;
      overflow: hidden;
      white-space: pre-line;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }
    .popup.is-large #popup-copy {
      display: block;
      overflow: visible;
      -webkit-line-clamp: unset;
    }
    .popup-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 7px; }
    .popup-title-row h2 { margin: 0 8px; }
    .popup-play {
      display: none;
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      background: #547d5a;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    .popup.is-large .popup-play { display: block; }
    .popup-play:disabled { background: #b9c1b5; cursor: not-allowed; }
    .popup p:last-child { margin: 0 8px; color: #647266; font-size: 13px; line-height: 1.5; }
    .popup-image {
      display: block;
      width: 100%;
      height: 126px;
      margin: 0 0 13px;
      border-radius: 7px;
      background: #e6e9dc;
      object-fit: cover;
    }
    .popup-audio[hidden], .popup-audio-note[hidden] { display: none; }
    .popup-audio-note { margin: 12px 8px 0; color: #829080; font-size: 12px; }
    .footer-note {
      position: fixed;
      right: clamp(22px, 5vw, 68px);
      bottom: 26px;
      color: #829080;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      pointer-events: none;
    }
    @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 560px) {
      .intro { top: 34px; }
      .hint { max-width: 230px; font-size: 13px; }
      .footer-note { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="intro">
    <!-- <p class="eyebrow">A little field study · No. 01</p> -->
    <h1>Animaltopia, yours to peruse.</h1>
    <p class="hint">Follow a dot. Hover to let it rest.</p>
  </header>
  <main id="field" aria-label="Seventeen drifting dots. Hover over or focus a dot to see its image."></main>
  <div class="popup-backdrop" id="popup-backdrop" hidden></div>
  <aside class="popup" id="popup" role="status" aria-live="polite" hidden>
    <img class="popup-image" id="popup-image" alt="">
    <p class="popup-kicker" id="popup-kicker"></p>
    <div class="popup-title-row">
      <h2 id="popup-title"></h2>
      <button class="popup-play" id="popup-play" type="button" aria-label="Play sound" title="Play sound" disabled>▶</button>
    </div>
    <p id="popup-copy"></p>
    <audio id="popup-audio" preload="none" hidden></audio>
    <p class="popup-audio-note" id="popup-audio-note" hidden></p>
  </aside>
  <div class="footer-note" aria-hidden="true">sixteen? animals to discover</div>
  <script>
    // Customize each dot's content, image, sound path, and speed here. Speed 1 is normal.
    const dotData = [
      { title: "Kelnuu (Pale Stalker)", description: "Clopnair: “Kan sckk whor, scho.” \n(clop, scrape, whicker... “I stalk the prey, in stillness.”) \n“Kan nei whei, kinn.”\n(“I am gentle to you. Come near.” -- Deceitful)", image: "images/my_diffusion_01.png", sound: "./sounds/sound_neigh_clop_0.wav", speed: 1 },
      { title: "Sqohmoo (The Bellowing Pink)", description: "Mooroar: “Moh gloom mmb, mooh-mooh.” \n(low, rolling drone... “I graze in the field. All is well.”) \n“Moh boo ymm-ah... HEY!” \n(“I will call to you in a voice that is not mine... HEY!”) \n“AH-HEY boo nooh-sq!”\n(“GET AWAY! You were being watched!”)", image: "images/my_diffusion_02.png", sound: "./sounds/sound_cow_moo_0.wav", speed: 1.4, color: "#e78ab3" },
      { title: "Tsitsi (Rattletail)", description: "Chitterglitch: “T-t-t-tk-tk, kri rrost ts^ee, t-t-tk-tk.” \n(“Watching, watching... you in the tree are wrong. Watching.”)", image: "images/my_diffusion_03.png", sound: "./sounds/sound_chitter_glitch_0.wav", speed: 1, color: "#9a8f82" },
      { title: "Gubdulloo (Burrow-Turkey)", description: "Mollokk: “Hoolum bloo gobb... shhm!” \n(“The surface... you called to it. Cave-in!”)", image: "images/my_diffusion_04.png", sound: "./sounds/sound_turkey_gobble.wav", speed: 1.2, color: "#a65f52" },
      { title: "Liimaril (Reef Dancer)", description: "Bloomaril: “Lii maril shulo, llora.” \n(soft bubbles, golden wash... “I glide through the reef, toward the light.”)", image: "images/my_diffusion_05.png", sound: "./sounds/sound_bubbling_underwater_0.wav", speed: 1, color: "#526da8" },
      { title: "Kkashell (Clawdia)", description: "Snipsk: “Kka rokk tkit, tchu hhk.” \n(clack, click, spit... “I watch my shell, you pathetic thing.”) \n“Tchu kka rokk snip-ck, scaa, scaa, scaa.” \n(“You touch my rock and I will pinch you. Go away. Go away. Go away.”)", image: "images/my_diffusion_06.png", sound: "./sounds/sound_crab.wav", speed: 2 },
      { title: "Thuumlor (Bogwarden)", description: "Lorrumm: “Orn thuum mum-lef, mogg.” \n(“I will stand beside you, and the moss agrees.”) \n “Ghal creel dremm mum-rin, nuum.” \n(“The axe, the bark remembers it, a hundred rings ago. Let it rot gently.”)", image: "images/my_diffusion_07.png", sound: "./sounds/sound_nature.wav", speed: .7, color: "#a9b83f" },
      { title: "Zrigrunn (Leafgrit)", description: "Rasprikk: “Rrk leef zri, ssrr.” \n(rasp, grind, warm zzt... “I eat the leaf, in the sun.”) \n“Skree zzel zri-zz, grunn, grunn.” \n(“I will sing for my mate: ugly, ugly, ugly.”)", image: "images/my_diffusion_08.png", sound: "./sounds/sound_insect.wav", speed: 1, color: "#6f9b58" },
      { title: "Thhwhw (Soot-Runner)", description: "Flapwhuff: “Ffth thh whw.” \n(flap-thump-flutter... “I run in the smog.”) \n“Fhk ffwh! Thwk wwf!” \n(“Danger here! You, stay still!”) \n“Wff ffth wwf-th.” \n(“The sky... I lost it, you lost it.”)", image: "images/my_diffusion_09.png", sound: "./sounds/sound_fluttering_wings_0.wav", speed: 1 },
      { title: "Orraeshae (Tidestrider)", description: "Slivaru: “Shae vellu aru, lluu.” \n(slow slash, long glide... “I run on the water, in calm.”)", image: "images/my_diffusion_10.png", sound: "./sounds/sound_water_gazelle.wav", speed: 1, color: "#4f9b91" },
      { title: "Ny (We)", description: "Voomael: “Mael ny vuum lii-hii, mael.” \n(“We swirl in the purple depth, pulsing pink, swirling.”) \n“Umi ny nolu orru, vael-hii, umi.”\n(“We feed the rotting ground through our threads; we will grow, feeding.”)", image: "images/my_diffusion_11.png", sound: "./sounds/sound_sarcastic_chirp_0.wav", speed: 0.5, color: "#70528c" },
      { title: "Thumpetti (little drummers)", description: "Thumpet: “Hu thum, bamm... pet-sorr.” \n(thump, thump, tap... “I am strong, big... small, sorry.”) \n“Hu mimi hoopa-pt, THUM!” \n(“I will protect my friend, and I mean it!”)", image: "images/my_diffusion_12.png", sound: "./sounds/sound_ape.wav", speed: 1.3, color: "#a6b4a0" },
      { title: "Ckarkhoor (Dust Stag)", description: "Kharrock: “Ckar kur rokk, kk-kk-kk-kk.” \n(“Your crown, I challenge it.”)", image: "images/my_diffusion_13.png", sound: "./sounds/sound_antler.wav", speed: 1, color: "#bd7b43" },
      { title: "Woolmm (Moonhowler)", description: "Baelowl: “Tuum wool owlu, mm.” \n(bleat, then a rising howl... “We follow the moon, together.”) \n“Howwl beh wrael-ae, ooroo.” \n(“I mourned the wolf I was, in the Long Night.”)", image: "images/my_diffusion_14.png", sound: "./sounds/sound_cow_moo_1.wav", speed: 0.3 },
      { title: "Timmora (Clickwraith)", description: "Tikkoloth: “Rrak tuul wiith, ti.” \n(click, trill, silence... “I wait in the tunnel for warm life.”) \n“Vass chhi, kell oo, ti.” \n(“Open space. I am hiding. You are near the wall, and I know it.”)", image: "images/my_diffusion_15.png", sound: "./sounds/sound_clicking.wav", speed: 1, color: "#394c6d" },
      { title: "Skitthikk (The Nightweaver)", description: "“Kiss thrett, sse ketta thikk-ik, tak.\n(“Silent prey, I feel my web... close.”)", image: "images/my_diffusion_16.png", sound: "./sounds/sound_creepy_skittering_0.wav", speed: 1, color: "#91a83b" }
    ];
    // This dot has independent content and movement settings, and flees from the pointer.
    const cursorAvoiderData = {
      title: "The Elusive One",
      description: "This little wanderer always keeps a bit of distance from your cursor.",
      image: "images/my_diffusion_00.png",
      sound: "./sounds/sound_melancholy_static_0.wav",
      speed: 1.2,
      avoidsCursor: true
    };
    const colors = ["#d8d8d2", "#bc805b", "#718b68", "#c19a55", "#657d83", "#a66e5a", "#f28c28", "#8b7182", "#548279", "#b37b4e"];
    const field = document.querySelector("#field");
    const popup = document.querySelector("#popup");
    const popupBackdrop = document.querySelector("#popup-backdrop");
    const popupImage = document.querySelector("#popup-image");
    const popupKicker = document.querySelector("#popup-kicker");
    const popupTitle = document.querySelector("#popup-title");
    const popupCopy = document.querySelector("#popup-copy");
    const popupAudio = document.querySelector("#popup-audio");
    const popupAudioNote = document.querySelector("#popup-audio-note");
    const popupPlay = document.querySelector("#popup-play");
    const dots = [];
    const pointer = { x: null, y: null };
    let activeDot = null;
    let pinnedDot = null;
    let lastFrame = performance.now();

    function placePopup(dot) {
      if (!dot || popup.hidden || popup.classList.contains("is-large")) return;
      const rect = dot.element.getBoundingClientRect();
      const box = popup.getBoundingClientRect();
      const gap = 18;
      let left = rect.left + rect.width / 2 + gap;
      let top = rect.top + rect.height / 2 - box.height / 2;
      if (left + box.width > innerWidth - 12) left = rect.left - box.width - gap;
      left = Math.max(12, Math.min(left, innerWidth - box.width - 12));
      top = Math.max(12, Math.min(top, innerHeight - box.height - 12));
      popup.style.left = `${left}px`;
      popup.style.top = `${top}px`;
    }

    function showNote(dot) {
      activeDot = dot;
      dot.element.classList.add("is-open");
      const data = dot.data;
      popupKicker.textContent = dot.avoidsCursor ? "Special dot" : `Image ${String(dot.index + 1).padStart(2, "0")}`;
      popupTitle.textContent = data.title;
      popupCopy.textContent = data.description;
      popupImage.src = data.image;
      popupImage.alt = `${data.title}, from the image collection`;
      popupAudio.pause();
      popupAudio.removeAttribute("src");
      popupAudio.load();
      popupPlay.disabled = !data.sound;
      popupPlay.textContent = "\u25B6";
      popupPlay.setAttribute("aria-label", data.sound ? "Play sound" : "No sound assigned");
      popupPlay.title = data.sound ? "Play sound" : "No sound assigned to this dot";
      popupAudioNote.hidden = Boolean(data.sound);
      popupAudioNote.textContent = data.sound ? "" : "Add a sound path to this dot’s data to enable playback.";
      if (data.sound) {
        popupAudio.src = new URL(data.sound, document.baseURI).href;
        popupAudio.load();
      }
      popup.hidden = false;
      requestAnimationFrame(() => placePopup(dot));
    }

    popupPlay.addEventListener("click", async () => {
      if (!popupAudio.hasAttribute("src")) return;
      if (popupAudio.paused) {
        try {
          await popupAudio.play();
        } catch {
          popupAudioNote.textContent = "This sound file could not be played. Check its path and format.";
          popupAudioNote.hidden = false;
        }
      } else {
        popupAudio.pause();
      }
    });
    popupAudio.addEventListener("play", () => {
      popupPlay.textContent = "\u23F8";
      popupPlay.setAttribute("aria-label", "Pause sound");
      popupPlay.title = "Pause sound";
    });
    popupAudio.addEventListener("pause", () => {
      popupPlay.textContent = "\u25B6";
      popupPlay.setAttribute("aria-label", "Play sound");
      popupPlay.title = "Play sound";
    });
    popupAudio.addEventListener("error", () => {
      popupAudioNote.textContent = "The sound file could not be loaded. Check that sounds/sound_00.wav is available.";
      popupAudioNote.hidden = false;
    });

    function hideNote(dot) {
      if (activeDot !== dot) return;
      if (pinnedDot === dot) return;
      dot.element.classList.remove("is-open");
      activeDot = null;
      popup.hidden = true;
    }

    function createDot(data, index, options = {}) {
      const element = document.createElement("button");
      element.className = "dot";
      element.type = "button";
      element.style.setProperty("--dot-color", options.avoidsCursor ? "#000000" : data.color ?? colors[index % colors.length]);
      element.setAttribute("aria-label", `${options.avoidsCursor ? "Special dot" : `Dot ${index + 1}`}: ${data.title}`);
      element.setAttribute("aria-describedby", "popup");
      field.appendChild(element);
      const radius = 16;
      const dot = {
        element, index, data, radius, speed: data.speed ?? 1, avoidsCursor: Boolean(options.avoidsCursor),
        x: radius + Math.random() * Math.max(1, innerWidth - radius * 2),
        y: radius + Math.random() * Math.max(1, innerHeight - radius * 2),
        vx: (Math.random() < .5 ? -1 : 1) * (18 + Math.random() * 27),
        vy: (Math.random() < .5 ? -1 : 1) * (16 + Math.random() * 25),
        paused: false
      };
      element.addEventListener("pointerenter", () => { if (!dot.avoidsCursor) dot.paused = true; showNote(dot); });
      element.addEventListener("pointerleave", () => { if (!dot.avoidsCursor) dot.paused = false; hideNote(dot); });
      element.addEventListener("focus", () => { dot.paused = true; showNote(dot); });
      element.addEventListener("blur", () => { dot.paused = false; hideNote(dot); });
      element.addEventListener("click", () => {
        if (activeDot && activeDot !== dot) activeDot.paused = false;
        pinnedDot = dot;
        dot.paused = true;
        showNote(dot);
        popup.style.left = "";
        popup.style.top = "";
        popup.classList.add("is-large");
        popupBackdrop.hidden = false;
      });
      dots.push(dot);
      draw(dot);
    }

    function draw(dot) {
      const margin = dot.radius;
      dot.x = Math.max(margin, Math.min(innerWidth - margin, dot.x));
      dot.y = Math.max(margin, Math.min(innerHeight - margin, dot.y));
      dot.element.style.left = `${dot.x}px`;
      dot.element.style.top = `${dot.y}px`;
    }

    function animate(now) {
      const dt = Math.min((now - lastFrame) / 1000, .04);
      lastFrame = now;
      for (const dot of dots) {
        if (!dot.paused) {
          dot.x += dot.vx * dt * dot.speed;
          dot.y += dot.vy * dt * dot.speed;
          if (dot.avoidsCursor && pointer.x !== null) {
            const dx = dot.x - pointer.x;
            const dy = dot.y - pointer.y;
            const distance = Math.hypot(dx, dy);
            const avoidRadius = 170;
            if (distance < avoidRadius) {
              const strength = (1 - distance / avoidRadius) * 210;
              dot.x += (dx / (distance || 1)) * strength * dt * dot.speed;
              dot.y += (dy / (distance || 1)) * strength * dt * dot.speed;
            }
          }
          if (dot.x < dot.radius || dot.x > innerWidth - dot.radius) dot.vx *= -1;
          if (dot.y < dot.radius || dot.y > innerHeight - dot.radius) dot.vy *= -1;
        }
        draw(dot);
      }
      if (activeDot) placePopup(activeDot);
      requestAnimationFrame(animate);
    }

    for (let i = 0; i < dotData.length; i++) createDot(dotData[i], i);
    createDot(cursorAvoiderData, dotData.length, { avoidsCursor: true });
    popupBackdrop.addEventListener("click", () => {
      popupAudio.pause();
      if (pinnedDot) pinnedDot.paused = false;
      if (activeDot) activeDot.element.classList.remove("is-open");
      pinnedDot = null;
      activeDot = null;
      popup.classList.remove("is-large");
      popupBackdrop.hidden = true;
      popup.hidden = true;
    });
    addEventListener("pointermove", (event) => { pointer.x = event.clientX; pointer.y = event.clientY; });
    addEventListener("pointerleave", () => { pointer.x = null; pointer.y = null; });
    addEventListener("resize", () => dots.forEach(draw));
    requestAnimationFrame(animate);
  </script>
</body>
</html>
