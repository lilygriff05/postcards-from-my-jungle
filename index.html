<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3e9">
  <title>Small things, drifting</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #23372c;
      --paper: #f4f3e9;
      --muted: #68776a;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background:
        radial-gradient(ellipse at 14% 84%, rgba(193, 210, 163, .24), transparent 34%),
        radial-gradient(ellipse at 85% 12%, rgba(224, 190, 130, .18), transparent 30%),
        var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }
    .intro {
      position: fixed;
      top: clamp(28px, 7vh, 72px);
      left: clamp(24px, 7vw, 100px);
      z-index: 1;
      pointer-events: none;
    }
    .eyebrow {
      margin: 0 0 12px;
      color: #6e866e;
      font: 600 11px/1.3 "Segoe UI", sans-serif;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 460px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(38px, 6vw, 72px);
      font-weight: 400;
      letter-spacing: -.045em;
      line-height: .98;
    }
    .hint {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .015em;
    }
    #field { position: fixed; inset: 0; overflow: hidden; }
    .dot {
      --dot-color: #547d5a;
      position: absolute;
      display: grid;
      width: 23px;
      height: 23px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: var(--dot-color);
      box-shadow: 0 3px 12px color-mix(in srgb, var(--dot-color) 25%, transparent);
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: width .2s ease, height .2s ease, box-shadow .2s ease;
      z-index: 2;
      -webkit-tap-highlight-color: transparent;
    }
    .dot::after {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: inherit;
      background: rgba(255,255,255,.55);
      content: "";
    }
    .dot:hover, .dot:focus-visible, .dot.is-open {
      width: 31px;
      height: 31px;
      box-shadow: 0 0 0 8px color-mix(in srgb, var(--dot-color) 15%, transparent), 0 5px 18px color-mix(in srgb, var(--dot-color) 30%, transparent);
      outline: none;
    }
    .dot:focus-visible { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--dot-color); }
    .popup {
      position: fixed;
      z-index: 5;
      width: min(260px, calc(100vw - 32px));
      padding: 10px 10px 15px;
      border: 1px solid rgba(42, 65, 48, .1);
      border-radius: 12px;
      background: rgba(255, 255, 250, .96);
      box-shadow: 0 14px 42px rgba(45, 58, 39, .14);
      pointer-events: none;
      animation: arrive .18s ease-out both;
    }
    .popup[hidden] { display: none; }
    .popup-kicker {
      margin: 0 8px 7px;
      color: #788a72;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .popup h2 {
      margin: 0 8px 7px;
      color: #293d30;
      font: 400 21px/1.15 Georgia, "Times New Roman", serif;
    }
    .popup p:last-child { margin: 0 8px; color: #647266; font-size: 13px; line-height: 1.5; }
    .popup-image {
      display: block;
      width: 100%;
      height: 126px;
      margin: 0 0 13px;
      border-radius: 7px;
      background: #e6e9dc;
      object-fit: cover;
    }
    .footer-note {
      position: fixed;
      right: clamp(22px, 5vw, 68px);
      bottom: 26px;
      color: #829080;
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      pointer-events: none;
    }
    @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 560px) {
      .intro { top: 34px; }
      .hint { max-width: 230px; font-size: 13px; }
      .footer-note { font-size: 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="intro">
    <p class="eyebrow">A little field study · No. 01</p>
    <h1>Small things,<br>drifting.</h1>
    <p class="hint">Follow a dot. Hover to let it rest.</p>
  </header>
  <main id="field" aria-label="Sixteen drifting dots. Hover over or focus a dot to see its image."></main>
  <aside class="popup" id="popup" role="status" aria-live="polite" hidden>
    <img class="popup-image" id="popup-image" alt="">
    <p class="popup-kicker" id="popup-kicker"></p>
    <h2 id="popup-title"></h2>
    <p id="popup-copy"></p>
  </aside>
  <div class="footer-note" aria-hidden="true">Sixteen small discoveries</div>
  <script>
    // Customize each dot's content, image, and speed here. Speed 1 is normal, 0.5 is half, 2 is double.
    const dotData = [
      { title: "A small discovery 01", description: "Image 01 from the collection.", image: "images/my_diffusion_00 (1).png", speed: 1 },
      { title: "A small discovery 02", description: "Image 02 from the collection.", image: "images/my_diffusion_01 (1).png", speed: 1.4 },
      { title: "A small discovery 03", description: "Image 03 from the collection.", image: "images/my_diffusion_02 (1).png", speed: 1 },
      { title: "A small discovery 04", description: "Image 04 from the collection.", image: "images/my_diffusion_03 (1).png", speed: 1.2 },
      { title: "A small discovery 05", description: "Image 05 from the collection.", image: "images/my_diffusion_04 (1).png", speed: 1 },
      { title: "A small discovery 06", description: "Image 06 from the collection.", image: "images/my_diffusion_05 (1).png", speed: 2 },
      { title: "A small discovery 07", description: "Image 07 from the collection.", image: "images/my_diffusion_06 (1).png", speed: 1 },
      { title: "A small discovery 08", description: "Image 08 from the collection.", image: "images/my_diffusion_07 (1).png", speed: 1 },
      { title: "A small discovery 09", description: "Image 09 from the collection.", image: "images/my_diffusion_08 (1).png", speed: 1 },
      { title: "A small discovery 10", description: "Image 10 from the collection.", image: "images/my_diffusion_09 (1).png", speed: 1 },
      { title: "A small discovery 11", description: "Image 11 from the collection.", image: "images/my_diffusion_10 (1).png", speed: 0.5 },
      { title: "A small discovery 12", description: "Image 12 from the collection.", image: "images/my_diffusion_11 (1).png", speed: 1.3 },
      { title: "A small discovery 13", description: "Image 13 from the collection.", image: "images/my_diffusion_12 (1).png", speed: 1 },
      { title: "A small discovery 14", description: "Image 14 from the collection.", image: "images/my_diffusion_13 (1).png", speed: 0.3 },
      { title: "A small discovery 15", description: "Image 15 from the collection.", image: "images/my_diffusion_14 (1).png", speed: 1 },
      { title: "A small discovery 16", description: "Image 16 from the collection.", image: "images/my_diffusion_15 (1).png", speed: 1 }
    ];
    const colors = ["#547d5a", "#bc805b", "#718b68", "#c19a55", "#657d83", "#a66e5a", "#84945a", "#8b7182", "#548279", "#b37b4e"];
    const field = document.querySelector("#field");
    const popup = document.querySelector("#popup");
    const popupImage = document.querySelector("#popup-image");
    const popupKicker = document.querySelector("#popup-kicker");
    const popupTitle = document.querySelector("#popup-title");
    const popupCopy = document.querySelector("#popup-copy");
    const dots = [];
    let activeDot = null;
    let lastFrame = performance.now();

    function placePopup(dot) {
      if (!dot || popup.hidden) return;
      const rect = dot.element.getBoundingClientRect();
      const box = popup.getBoundingClientRect();
      const gap = 18;
      let left = rect.left + rect.width / 2 + gap;
      let top = rect.top + rect.height / 2 - box.height / 2;
      if (left + box.width > innerWidth - 12) left = rect.left - box.width - gap;
      left = Math.max(12, Math.min(left, innerWidth - box.width - 12));
      top = Math.max(12, Math.min(top, innerHeight - box.height - 12));
      popup.style.left = `${left}px`;
      popup.style.top = `${top}px`;
    }

    function showNote(dot) {
      activeDot = dot;
      dot.element.classList.add("is-open");
      const data = dotData[dot.index];
      popupKicker.textContent = `Image ${String(dot.index + 1).padStart(2, "0")}`;
      popupTitle.textContent = data.title;
      popupCopy.textContent = data.description;
      popupImage.src = data.image;
      popupImage.alt = `${data.title}, from the image collection`;
      popup.hidden = false;
      requestAnimationFrame(() => placePopup(dot));
    }

    function hideNote(dot) {
      if (activeDot !== dot) return;
      dot.element.classList.remove("is-open");
      activeDot = null;
      popup.hidden = true;
    }

    function createDot(index) {
      const element = document.createElement("button");
      element.className = "dot";
      element.type = "button";
      element.style.setProperty("--dot-color", colors[index % colors.length]);
      element.setAttribute("aria-label", `Dot ${index + 1}: ${dotData[index].title}`);
      element.setAttribute("aria-describedby", "popup");
      field.appendChild(element);
      const radius = 16;
      const dot = {
        element, index, radius, speed: dotData[index].speed ?? 1,
        x: radius + Math.random() * Math.max(1, innerWidth - radius * 2),
        y: radius + Math.random() * Math.max(1, innerHeight - radius * 2),
        vx: (Math.random() < .5 ? -1 : 1) * (18 + Math.random() * 27),
        vy: (Math.random() < .5 ? -1 : 1) * (16 + Math.random() * 25),
        paused: false
      };
      element.addEventListener("pointerenter", () => { dot.paused = true; showNote(dot); });
      element.addEventListener("pointerleave", () => { dot.paused = false; hideNote(dot); });
      element.addEventListener("focus", () => { dot.paused = true; showNote(dot); });
      element.addEventListener("blur", () => { dot.paused = false; hideNote(dot); });
      element.addEventListener("click", () => {
        if (activeDot === dot) { dot.paused = false; hideNote(dot); }
        else { if (activeDot) activeDot.paused = false; dot.paused = true; showNote(dot); }
      });
      dots.push(dot);
      draw(dot);
    }

    function draw(dot) {
      const margin = dot.radius;
      dot.x = Math.max(margin, Math.min(innerWidth - margin, dot.x));
      dot.y = Math.max(margin, Math.min(innerHeight - margin, dot.y));
      dot.element.style.left = `${dot.x}px`;
      dot.element.style.top = `${dot.y}px`;
    }

    function animate(now) {
      const dt = Math.min((now - lastFrame) / 1000, .04);
      lastFrame = now;
      for (const dot of dots) {
        if (!dot.paused) {
          dot.x += dot.vx * dt * dot.speed;
          dot.y += dot.vy * dt * dot.speed;
          if (dot.x < dot.radius || dot.x > innerWidth - dot.radius) dot.vx *= -1;
          if (dot.y < dot.radius || dot.y > innerHeight - dot.radius) dot.vy *= -1;
        }
        draw(dot);
      }
      if (activeDot) placePopup(activeDot);
      requestAnimationFrame(animate);
    }

    for (let i = 0; i < dotData.length; i++) createDot(i);
    addEventListener("resize", () => dots.forEach(draw));
    requestAnimationFrame(animate);
  </script>
</body>
</html>
